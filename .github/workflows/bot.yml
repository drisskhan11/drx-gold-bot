name: Quantum Beast Runner

on:
  schedule:
    - cron: '*/5 6-16 * * 1-5'
    - cron: '*/15 0-5,17-23 * * 1-5'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Cache State Database
      uses: actions/cache@v4
      with:
        path: quantum_beast_31.db
        key: ${{ runner.os }}-quantum-beast-db-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-quantum-beast-db-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Bot
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TICKERLAYER_API_KEY: ${{ secrets.TICKERLAYER_API_KEY }}
        FLASHALPHA_API_KEY: ${{ secrets.FLASHALPHA_API_KEY }}
      run: python app.py
